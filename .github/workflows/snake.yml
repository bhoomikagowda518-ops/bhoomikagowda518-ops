name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: bhoomikagowda518-ops
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%2339d353
            dist/github-contribution-grid-snake-dark.svg?palette=github-light&color_snake=%2339d353

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
