name: Update Contribution Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download contribution graph
        run: |
          mkdir -p assets
          curl -L "https://github-readme-activity-graph-hkq3d44n4-bhoomika-s-portfolio.vercel.app/graph?username=bhoomikagowda518-ops&bg_color=0D1117&color=A78BFA&line=38BDF8&point=FFFFFF&area=true&hide_border=true&theme=tokyo-night" \
            -o assets/contribution-activity.svg

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contribution-activity.svg

          if git diff --cached --quiet; then
            echo "No changes to contribution graph."
          else
            git commit -m "Update contribution activity graph"
            git push
          fi
